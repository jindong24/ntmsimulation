# aaanew2.py historically used unscaled interface terms; the publication workflow
# intentionally uses the later test_final.py interface fluxes.
# Initial vectors are always read from the selected input XML.
calibration_dt: 0.16666666666666666
stages:
  - name: aaanew2_parameter_subset
    objective: relative_l2_target
    optimizer: {maxiter: 30, gtol: 1.0e-12, ftol: 1.0e-12}
    parameters:
      - {name: tauM, transform: linear, lower: 0.0, upper: 100.0}
      - {name: tauB, transform: linear, lower: 0.0, upper: 100.0}
      - {name: dMb, transform: log, lower: 1.0e-8, upper: 10.0}
      - {name: lambdaB, transform: log, lower: "parameter:lambdaB1", upper: "parameter:lambdaB2"}
      - {name: M0, transform: log, lower: 1.0e-4, upper: 0.75}
      - {name: alpha1, transform: linear, lower: -100.0, upper: 100.0}
      - {name: DM, transform: log, lower: 1.0e-9, upper: 1.0}
      - {name: DB1, transform: log, lower: 1.0e-9, upper: 1.0}
      - {name: DB2, transform: log, lower: 1.0e-9, upper: 1.0}
      - {name: dM, transform: log, lower: 1.0e-9, upper: 1.0}
      - {name: dB, transform: log, lower: 1.0e-9, upper: 1.0}
      - {name: delta, transform: log, lower: 1.0e-9, upper: 1.0}
